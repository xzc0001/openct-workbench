<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CT 重建工作台</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><a class="brand" href="/workbench/">CT 重建工作台</a><nav><a id="portal-link" href="/" hidden>结果浏览</a><a href="#storage-section" id="storage-link">存储清理</a><button id="account-open" class="text-button">账号设置</button><span id="account-name" class="muted"></span><button id="logout" class="text-button">退出</button></nav></header>
<main class="workspace"><aside class="exam-rail"><div class="rail-heading"><h1>检查影像</h1><button class="primary" id="import-open">导入 CT</button></div><input type="search" id="exam-search" placeholder="搜索备注名或检查编号" aria-label="搜索检查影像"><section id="exam-list" aria-label="检查列表"></section><p id="environment" class="environment" role="status">正在连接服务</p></aside><section id="jobs" class="exam-workspace" aria-label="检查详情"><p class="empty">导入 CT 或选择已有检查</p></section></main>
<section class="storage" id="storage-section"><details id="storage-panel"><summary>存储清理</summary><div id="storage-summary" class="storage-summary">正在读取占用</div><div class="storage-toolbar"><button id="storage-refresh">刷新占用</button><button id="storage-cache">清理缓存</button></div><div id="storage-tasks"></div><fieldset class="cleanup-options"><legend>清理方式</legend><label><input type="radio" name="cleanup-action" value="temporary" checked><span>清理临时数据<small>保留影像和当前重建，移除本检查的计算缓存和上一版备份。</small></span></label><label><input type="radio" name="cleanup-action" value="archive"><span>仅保留离线预览<small>移除上传影像、分割和 STL，后续重建需重新导入。</small></span></label><label><input type="radio" name="cleanup-action" value="delete"><span>删除检查<small>移除影像、重建数据和预览。</small></span></label></fieldset><button id="storage-plan">查看清理范围</button><p id="storage-status" role="status"></p></details></section>
<dialog id="import-dialog"><div class="dialog-heading"><h2>导入 CT</h2><button id="import-close">关闭</button></div><label class="field">备注名（选填）<input id="import-note" maxlength="80" autocomplete="off"></label><div id="plan-controls"></div><div class="upload-actions"><label class="primary file-button" for="zip">选择 ZIP</label><label class="file-button" for="dicom-files">选择 DICOM 文件</label><label class="file-button" for="folder">选择 DICOM 文件夹</label><input id="zip" type="file" accept=".zip"><input id="dicom-files" type="file" accept=".dcm,.ima,application/dicom" multiple><input id="folder" type="file" webkitdirectory multiple></div><div id="upload-status" role="status"></div><progress id="upload-progress" max="100" value="0" hidden></progress></dialog>
<footer><span>自动重建结果需结合原始影像复核</span><span>离线计算</span></footer></body></html>
