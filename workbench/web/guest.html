<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>游客访问</title><style>
:root{font:14px "Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;color:#1c2024;background:#fcfcfd}*{box-sizing:border-box}body{margin:0}header{padding:20px 32px;border-bottom:.5px solid #d9d9e0;font-weight:600;font-size:20px}main{max-width:900px;margin:32px auto;padding:0 24px}h1{font-size:20px}p{color:#60646c}.study{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:.5px solid #d9d9e0}a{color:#0d74ce;text-decoration:none}a:hover{text-decoration:underline}
</style></head><body><header>CT 重建预览</header><main><h1>分享的检查</h1><p id="status" role="status">正在打开链接</p><section id="studies"></section></main><script>
(async()=>{const token=location.hash.slice(1);if(token)history.replaceState(null,'',location.pathname);const status=document.querySelector('#status');try{if(token){const response=await fetch('/api/guest/enter',{method:'POST',headers:{'X-Local-App':'1','Content-Type':'application/json'},body:JSON.stringify({token})});if(!response.ok)throw Error('链接无效或已过期')}const response=await fetch('/api/guest/studies');if(!response.ok)throw Error('链接无效或已过期');const data=await response.json();status.textContent=data.studies.length?'有效期至 '+new Date(data.expires*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'所选检查已不可用';const list=document.querySelector('#studies');for(const study of data.studies){const row=document.createElement('div'),name=document.createElement('span'),a=document.createElement('a');row.className='study';name.textContent=study.name;a.textContent='打开预览';a.href=study.preview;row.append(name,a);list.append(row)}}catch(error){status.textContent=error.message||'无法打开链接'}})();
</script></body></html>
